<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商場入口網站</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- AOS 動畫 -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: #333;
      padding: 10px;
      z-index: 1000;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    section {
      padding: 100px 20px;
      min-height: 100vh;
    }

    .banner {
      height: 100vh;
    }

    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      background-size: cover;
      background-position: center;
    }

    .gallery img {
      width: 200px;
      margin: 10px;
    }

    .btn {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<!-- 導覽列 -->
<nav>
  <a href="#product">產品介紹</a>
  <a href="#buy">如何購買</a>
  <a href="#faq">常見QA</a>
  <a href="#gallery">Gallery</a>
  <a href="#contact">聯絡方式</a>
</nav>

<!-- Banner 輪播 -->
<div class="banner">
  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide" style="background-image:url('https://picsum.photos/1200/800?1')"></div>
      <div class="swiper-slide" style="background-image:url('https://picsum.photos/1200/800?2')"></div>
      <div class="swiper-slide" style="background-image:url('https://picsum.photos/1200/800?3')"></div>
    </div>
  </div>
</div>

<!-- 產品介紹 -->
<section id="product">
  <h2 data-aos="fade-up">產品介紹</h2>
  <p data-aos="fade-up">這裡放產品說明內容</p>
</section>

<!-- 如何購買 -->
<section id="buy">
  <h2 data-aos="fade-up">如何購買</h2>
  <p>點擊下方按鈕前往付款</p>
  <a class="btn" href="https://example.com" target="_blank">前往購買</a>
</section>

<!-- FAQ -->
<section id="faq">
  <h2 data-aos="fade-up">常見QA</h2>
  <p><strong>Q:</strong> 問題？</p>
  <p><strong>A:</strong> 答案</p>
</section>

<!-- Gallery -->
<section id="gallery">
  <h2 data-aos="fade-up">Gallery</h2>
  <div class="gallery">
    <img src="https://picsum.photos/200?1">
    <img src="https://picsum.photos/200?2">
    <img src="https://picsum.photos/200?3">
  </div>
</section>

<!-- 聯絡方式 -->
<section id="contact">
  <h2 data-aos="fade-up">聯絡方式</h2>
  <p>Email: example@email.com</p>
</section>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

<script>
  const swiper = new Swiper('.swiper', {
    loop: true,
    autoplay: {
      delay: 3000,
    }
  });

  AOS.init();
</script>

</body>
</html>
